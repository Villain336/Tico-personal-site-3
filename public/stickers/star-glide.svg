<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- die-cut white border -->
  <rect x="8" y="8" width="224" height="224" rx="44" fill="#ffffff"/>
  <rect x="20" y="20" width="200" height="200" rx="34" fill="#12121a"/>
  <!-- starfield -->
  <circle cx="54" cy="60" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="186" cy="52" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="176" cy="176" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="62" cy="184" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="130" cy="44" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="44" cy="120" r="1.5" fill="#ffffff" opacity="0.6"/>
  <!-- glow -->
  <circle cx="120" cy="112" r="52" fill="#d7ff3e" opacity="0.18"/>
  <!-- Star of David (two triangles) -->
  <polygon points="120,58 166,138 74,138" fill="#d7ff3e" stroke="#12121a" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="120,166 74,86 166,86" fill="#d7ff3e" stroke="#12121a" stroke-width="5" stroke-linejoin="round"/>
  <!-- bird obstacle -->
  <path d="M168 62 C176 54 186 56 188 64 C196 60 204 66 200 74 C192 72 184 74 178 78 C176 70 172 66 168 62 Z" fill="#ff5b4a"/>
  <!-- label -->
  <text x="120" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="18" fill="#ffffff" letter-spacing="2">STAR GLIDE</text>
</svg>
